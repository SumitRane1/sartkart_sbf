<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCart Barcode Test</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        #scanner {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
        }

        video {
            width: 100%;
            display: block;
            border-radius: 12px;
            background: black;
        }

        .scan-box {
            position: absolute;
            top: 40%;
            left: 10%;
            width: 80%;
            height: 20%;
            border: 3px solid #00ff66;
            box-sizing: border-box;
        }

        button {
            padding: 14px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
        }

        #result {
            margin-top: 20px;
            padding: 18px;
            background: #222;
            border-radius: 10px;
            font-size: 24px;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <h1>SmartCart</h1>
    <p>Barcode Scanner Test</p>

    <div id="scanner">
        <video id="camera" autoplay playsinline></video>
        <div class="scan-box"></div>
    </div>

    <button onclick="startScanner()">
        Start Scanner
    </button>

    <div id="status">
        Scanner not started
    </div>

    <div id="result">
        No barcode detected
    </div>

    <script src="https://unpkg.com/@zxing/browser@latest"></script>

    <script>

        let reader;

        async function startScanner() {

            const video = document.getElementById("camera");
            const status = document.getElementById("status");
            const resultBox = document.getElementById("result");

            status.textContent = "Starting camera...";

            try {

                reader = new ZXingBrowser.BrowserMultiFormatReader();

                const devices =
                    await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

                console.log("Cameras:", devices);

                if (!devices.length) {
                    throw new Error("No camera found");
                }

                // Prefer rear camera
                let cameraId = devices[devices.length - 1].deviceId;

                for (const device of devices) {

                    const label = (device.label || "").toLowerCase();

                    if (
                        label.includes("back") ||
                        label.includes("rear") ||
                        label.includes("environment")
                    ) {
                        cameraId = device.deviceId;
                        break;
                    }
                }

                status.textContent = "Scanning...";

                await reader.decodeFromVideoDevice(
                    cameraId,
                    video,
                    (result, error) => {

                        if (result) {

                            const code = result.getText();

                            resultBox.textContent =
                                "Barcode: " + code;

                            status.textContent =
                                "Barcode detected ✅";

                            console.log("DETECTED:", code);
                        }

                    }
                );

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Error: " + error.message;
            }
        }

    </script>

</body>
</html>
