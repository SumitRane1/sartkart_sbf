<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCart Barcode Test</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 10px;
        }

        video {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            border-radius: 12px;
            background: black;
        }

        button {
            margin-top: 20px;
            padding: 14px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
        }

        #status {
            margin-top: 20px;
            font-size: 18px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #222;
            border-radius: 10px;
            font-size: 24px;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <h1>SmartCart</h1>
    <p>Barcode Scanner Test</p>

    <video id="camera" autoplay playsinline></video>

    <br>

    <button onclick="startScanner()">
        Start Scanner
    </button>

    <div id="status">
        Scanner not started
    </div>

    <div id="result">
        No barcode detected
    </div>


    <!-- ZXing barcode library -->
    <script src="https://unpkg.com/@zxing/browser@latest"></script>

    <script>

        let codeReader;

        async function startScanner() {

            const video = document.getElementById("camera");
            const status = document.getElementById("status");
            const result = document.getElementById("result");

            status.textContent = "Starting camera...";

            try {

                codeReader = new ZXingBrowser.BrowserMultiFormatReader();

                const devices =
                    await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

                if (devices.length === 0) {
                    throw new Error("No camera found");
                }

                // Try to use the rear camera
                let selectedDevice = devices[devices.length - 1];

                for (const device of devices) {

                    const label = device.label.toLowerCase();

                    if (
                        label.includes("back") ||
                        label.includes("rear") ||
                        label.includes("environment")
                    ) {
                        selectedDevice = device;
                        break;
                    }
                }

                status.textContent = "Scanning...";

                codeReader.decodeFromVideoDevice(
                    selectedDevice.deviceId,
                    video,
                    (resultData, error) => {

                        if (resultData) {

                            const barcode =
                                resultData.getText();

                            result.textContent =
                                "Barcode: " + barcode;

                            status.textContent =
                                "Barcode detected ✅";

                            console.log(
                                "Barcode:",
                                barcode
                            );
                        }

                    }
                );

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Scanner error ❌ " + error.message;
            }
        }

    </script>

</body>
</html>
